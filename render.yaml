services:
  - type: web
    name: minsk-food-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_PATH
        value: /data/minsk.db
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: 10000
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
