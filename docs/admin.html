<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Админ-панель</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 16px;
    }
    h1 { font-size: 24px; margin-bottom: 16px; }
    .admin-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeOut 0.3s ease forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.95); }
    }
    .admin-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd;
    }
    .admin-info { flex: 1; }
    .admin-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .admin-meta { font-size: 13px; color: #555; margin-bottom: 4px; }
    .admin-seller { font-size: 12px; color: #888; margin-bottom: 8px; }
    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }
    .btn-approve { background: #34c759; }
    .btn-reject { background: #ff3b30; }
    .btn-ban { background: #8e8e93; }
    .empty { text-align: center; color: #888; margin-top: 40px; }
  </style>
</head>
<body>
  <h1>⚙️ Админ-панель</h1>
  <div id="pendingContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      // ---------- КОНФИГУРАЦИЯ ----------
      const SUPABASE_URL = 'https://pfutmevbueqbfnhkwrrl.supabase.co';
      const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';   // <-- заменить
      const ADMIN_ID = 123456789;   // <-- заменить на Telegram ID администратора

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // Проверка прав администратора
      const user = tg.initDataUnsafe?.user;
      if (!user || user.id !== ADMIN_ID) {
        document.getElementById('pendingContainer').innerHTML =
          '<div class="empty">🚫 Доступ запрещён. Вы не администратор.</div>';
        return;
      }

      const container = document.getElementById('pendingContainer');

      async function loadPendingItems() {
        container.innerHTML = '<div class="empty">Загрузка...</div>';
        const { data, error } = await supabase
          .from('items')
          .select('*, profiles!inner(full_name, username, telegram_id)')
          .eq('status', 'pending')
          .order('created_at', { ascending: false });
        if (error) {
          container.innerHTML = '<div class="empty">Ошибка загрузки</div>';
          return;
        }
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="empty">Нет объявлений на модерации</div>';
          return;
        }
        renderPending(data);
      }

      function renderPending(items) {
        container.innerHTML = '';
        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'admin-card';
          const photo = (item.photos && item.photos.length > 0) ? item.photos[0] : 'https://via.placeholder.com/80?text=Нет';
          const seller = item.profiles || {};
          card.innerHTML = `
            <img src="${photo}" alt="фото">
            <div class="admin-info">
              <div class="admin-title">${escapeHtml(item.title)}</div>
              <div class="admin-meta">💰 ${item.price} BYN · 📍 ${escapeHtml(item.city)} · ${item.condition}</div>
              <div class="admin-seller">
                Продавец: ${escapeHtml(seller.full_name || '—')} (@${escapeHtml(seller.username || 'нет')}) ID: ${seller.telegram_id || '—'}
              </div>
              <div style="font-size:13px; margin-bottom:6px;">${escapeHtml(item.description || '')}</div>
              <div class="admin-actions">
                <button class="btn btn-approve" data-id="${item.id}" data-action="admin_approve">✅ Одобрить</button>
                <button class="btn btn-reject" data-id="${item.id}" data-action="admin_reject">❌ Отклонить</button>
                <button class="btn btn-ban" data-id="${item.id}" data-action="admin_ban">🚫 Бан</button>
              </div>
            </div>
          `;
          container.appendChild(card);

          // Привязка событий к кнопкам
          card.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
              const itemId = btn.dataset.id;
              const action = btn.dataset.action;
              const data = JSON.stringify({ action, item_id: itemId });
              tg.sendData(data);
              // Анимация удаления карточки
              card.style.animation = 'fadeOut 0.3s ease forwards';
              setTimeout(() => card.remove(), 300);
              tg.close();
            });
          });
        });
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, m => {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      loadPendingItems();
    })();
  </script>
</body>
</html>
