<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Админ-панель</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0f0f0f;--card:#1c1c1e;--text:#fff;--hint:#636366;--accent:#0a84ff;--good:#34c759;--bad:#ff3b30;--warn:#ff9500}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:12px;padding-bottom:40px}
    .header{text-align:center;margin-bottom:16px}
    .header h1{font-size:20px}
    .stats{text-align:center;color:var(--hint);font-size:14px;margin-bottom:16px}
    .empty{text-align:center;color:var(--hint);padding:60px 20px;font-size:15px}
    .card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:16px;transition:opacity .3s,transform .3s}
    .card.done{opacity:0;transform:translateX(100%)}
    .card-img{width:100%;aspect-ratio:16/10;background:#2c2c2e;overflow:hidden;position:relative}
    .card-img img{width:100%;height:100%;object-fit:cover;display:block}
    .no-img{font-size:48px;display:flex;align-items:center;justify-content:center;height:100%;color:var(--hint)}
    .card-body{padding:16px}
    .card-title{font-size:17px;font-weight:700;margin-bottom:6px}
    .card-price{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:4px}
    .card-meta{font-size:13px;color:var(--hint);margin-bottom:8px;line-height:1.5}
    .card-desc{font-size:14px;color:#ccc;line-height:1.5;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
    .card-seller{font-size:13px;color:var(--hint);margin-bottom:16px;padding:10px;background:rgba(255,255,255,0.03);border-radius:10px}
    .card-seller b{color:var(--text)}
    .actions{display:flex;gap:8px}
    .actions button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
    .btn-approve{background:var(--good)}
    .btn-reject{background:var(--bad)}
    .btn-ban{background:var(--hint)}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:200;display:none}
    .toast.error{background:var(--bad)}
    .toast.success{background:var(--good)}
    .refresh-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(10,132,255,0.4);z-index:50;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="header"><h1>⚙️ Админ-панель</h1></div>
  <div class="stats" id="stats">Загрузка...</div>
  <div id="list"></div>
  <button class="refresh-btn" id="refreshBtn" title="Обновить">↻</button>

  <script>
    const SUPABASE_URL = 'https://pfutmevbueqbfnhkwrrl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmdXRtZXZidWVxYmZuaGt3cnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTgwOTEsImV4cCI6MjEwMTc3NDA5MX0.hpTIoMmMJkTCdLLOyBv5HoTQ6eZnqR0e5f2v6PgR4Ok';

    let tg;
    try {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    } catch(e) {}

    function showToast(msg, type='') {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = 'toast ' + type;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function loadPending() {
      const list = document.getElementById('list');
      const stats = document.getElementById('stats');
      list.innerHTML = '';
      stats.innerText = 'Загрузка...';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/items?status=eq.pending&select=*,profiles(username,full_name,telegram_id)&order=created_at.desc`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const items = await res.json();

        stats.innerText = `На модерации: ${items.length}`;

        if (!items.length) {
          list.innerHTML = '<div class="empty">✅ Нет объявлений на модерации</div>';
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="card" id="card-${item.id}">
            <div class="card-img">
              ${item.photos && item.photos.length
                ? `<img src="${item.photos[0]}" loading="lazy">`
                : '<div class="no-img">📦</div>'}
            </div>
            <div class="card-body">
              <div class="card-title">${escapeHtml(item.title)}</div>
              <div class="card-price">${item.price} BYN</div>
              <div class="card-meta">
                🏙 ${item.city} · ${condLabel(item.condition)} · ${new Date(item.created_at).toLocaleDateString('ru-RU')}
              </div>
              <div class="card-desc">${escapeHtml(item.description || 'Нет описания')}</div>
              <div class="card-seller">
                👤 <b>${escapeHtml(item.profiles?.full_name || 'Без имени')}</b><br>
                @${escapeHtml(item.profiles?.username || 'нет')}<br>
                ID: <code>${item.profiles?.telegram_id || '—'}</code>
              </div>
              <div class="actions">
                <button class="btn-approve" onclick="sendAction('admin_approve','${item.id}')">✅ Одобрить</button>
                <button class="btn-reject" onclick="sendAction('admin_reject','${item.id}')">❌ Отклонить</button>
                <button class="btn-ban" onclick="sendAction('admin_ban','${item.profiles?.telegram_id}','${item.id}')">🚫 Бан</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (e) {
        console.error(e);
        stats.innerText = 'Ошибка загрузки';
        showToast('Ошибка загрузки', 'error');
      }
    }

    function condLabel(c) {
      return c === 'new' ? 'Новое' : c === 'like_new' ? 'Как новое' : 'Б/у';
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function sendAction(action, itemId, cardId) {
      // cardId используется только для бана, чтобы скрыть карточку
      const targetId = cardId || itemId;

      try {
        const data = { action: action };
        if (action === 'admin_ban') {
          data.tg_id = itemId; // для бана itemId это tg_id
        } else {
          data.item_id = itemId;
        }

        tg.sendData(JSON.stringify(data));

        // Скрываем карточку с анимацией
        const card = document.getElementById(`card-${targetId}`);
        if (card) {
          card.classList.add('done');
          setTimeout(() => card.remove(), 300);
        }

        const msg = action === 'admin_approve' ? '✅ Одобрено'
                  : action === 'admin_reject' ? '❌ Отклонено'
                  : '🚫 Забанен';
        showToast(msg, 'success');

        // Обновляем счётчик
        setTimeout(() => {
          const remaining = document.querySelectorAll('.card:not(.done)').length;
          document.getElementById('stats').innerText = `На модерации: ${remaining}`;
          if (remaining === 0) {
            document.getElementById('list').innerHTML = '<div class="empty">✅ Нет объявлений на модерации</div>';
          }
        }, 350);

      } catch (e) {
        showToast('Ошибка отправки', 'error');
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadPending);

    // Загружаем при старте
    loadPending();
  </script>
</body>
</html>
